# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "872547d3527f0a73ded53722092c1e5e"
name = "cadence-crm"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

# CLI 4.7 validation requires [events] with at least one subscription.
# Placeholder only — the real PRD-01 §6.2 topics get registered against the CRM
# endpoint once it exists. Nothing consumes this URI yet.
[events]
# Must be "unstable" — the events API accepts no dated version yet.
api_version = "unstable"

[[events.subscription]]
handle = "product_updates"
topic = "Product"
actions = ["update"]
uri = "/events/app/products"

[access.admin]
# orderCreate is offline-token-only (PRD-02 §6.1). With "online" it fails with
# "This mutation is only accessible to apps authenticated using offline tokens".
direct_api_mode = "offline"
embedded_app_direct_api_access = true

[access_scopes]
# PRD-02 §6.1 list, plus read_all_orders: plain read_orders only exposes the
# last 60 days, and we seed 18 months of history that the backfill (F1.6) must
# be able to read back.
scopes = "read_products,write_products,read_customers,write_customers,read_orders,write_orders,read_all_orders,read_checkouts,read_discounts,write_discounts"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[metaobjects.app.faq]
name = "FAQ"

[metaobjects.app.faq.fields.question]
name = "Question"
type = "single_line_text_field"
required = true

[metaobjects.app.faq.fields.answer]
name = "Answer"
type = "multi_line_text_field"
required = true

[metaobjects.app.faq.fields.show_on_faq_page]
name = "Show on FAQ page"
type = "boolean"

[product.metafields.app.faq]
name = "FAQ"
description = "FAQ for this product"
type = "metaobject_reference<$app:faq>"

  [product.metafields.app.faq.access]
  admin = "merchant_read_write"

[sidekick]
extensions_summary = "Read FAQ entries stored in the app"
